name: Sync plugin SHA to Factory marketplace

# Opens (or updates) a PR against Factory-AI/factory-plugins that re-pins the
# `apify` entry in .factory-plugin/marketplace.json to a commit of this repo.
# Upstream references the plugin as a `git-subdir` source (path `apify`) pinned
# by a full 40-character `sha`; Factory entries carry no `version` field, so only
# `source.sha` changes. The version from apify/.factory-plugin/plugin.json at
# that commit is recorded in the PR title and body instead.
#
# release.yml calls this after every stable release. To re-sync manually, run it
# from the Actions tab: it pins the branch or tag picked in "Use workflow from".
#
# Prerequisites:
#   1. A fork of Factory-AI/factory-plugins must exist at $FORK.
#   2. MARKETPLACE_PAT must be a PAT that can push to $FORK and create PRs in
#      $UPSTREAM (fine-grained tokens typically must be granted access to both
#      repositories).
#   3. The `apify` entry must already be merged upstream (update-only — it does
#      not create the entry on the first run).

on:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA of this repository to pin
        required: true
        type: string
      release_url:
        description: GitHub release URL linked from the upstream PR
        required: false
        type: string
    secrets:
      MARKETPLACE_PAT:
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: Factory-AI/factory-plugins
  FORK: apify/factory-plugins
  BASE_BRANCH: master
  PLUGIN_NAME: apify
  PLUGIN_PATH: apify
  MARKETPLACE_FILE: .factory-plugin/marketplace.json
  PR_BRANCH: apify/update-sha

jobs:
  sync-marketplace:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-marketplace
      cancel-in-progress: false
    steps:
      - name: Check out the plugin repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: plugin

      - name: Resolve the version and SHA to pin
        id: plugin
        working-directory: plugin
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          VERSION="$(jq -r '.version' "${PLUGIN_PATH}/.factory-plugin/plugin.json")"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pinning ${PLUGIN_NAME} ${VERSION} at ${SHA}"

      - name: Check out the apify fork of factory-plugins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FORK }}
          persist-credentials: false
          path: marketplace
          fetch-depth: 0

      - name: Sync fork's master onto upstream master
        working-directory: marketplace
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "upstream/${BASE_BRANCH}"

      - name: Re-pin the apify entry
        id: update
        working-directory: marketplace
        env:
          PLUGIN_SHA: ${{ steps.plugin.outputs.sha }}
        run: |
          set -euo pipefail

          # Update-only: bail out cleanly if the entry isn't upstream yet.
          if ! jq -e --arg n "$PLUGIN_NAME" 'any(.plugins[]; .name == $n)' "$MARKETPLACE_FILE" >/dev/null; then
            echo "::warning::No '$PLUGIN_NAME' entry found in $UPSTREAM yet — submit the first PR manually. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The entry must be a git-subdir source pointing at this repo's plugin directory.
          expected_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if ! jq -e --arg n "$PLUGIN_NAME" --arg url "$expected_url" --arg path "$PLUGIN_PATH" \
            '.plugins[] | select(.name == $n) | .source
             | type == "object" and .source == "git-subdir" and .path == $path
               and (.url == $url or .url == ($url + ".git"))' \
            "$MARKETPLACE_FILE" >/dev/null; then
            jq --arg n "$PLUGIN_NAME" '.plugins[] | select(.name == $n) | .source' "$MARKETPLACE_FILE"
            echo "::error::Expected the '$PLUGIN_NAME' entry to be a git-subdir source with url '${expected_url}(.git)' and path '$PLUGIN_PATH'."
            exit 1
          fi

          if [[ ! "$PLUGIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$PLUGIN_SHA' is not a full 40-character commit SHA."
            exit 1
          fi

          jq --indent 2 --arg n "$PLUGIN_NAME" --arg sha "$PLUGIN_SHA" \
            '(.plugins[] | select(.name == $n) | .source.sha) = $sha' \
            "$MARKETPLACE_FILE" > "$MARKETPLACE_FILE.tmp"
          mv "$MARKETPLACE_FILE.tmp" "$MARKETPLACE_FILE"

          others='{plugins: (.plugins | map(select(.name != env.PLUGIN_NAME)))} + (del(.plugins))'
          if [ "$(git show "HEAD:${MARKETPLACE_FILE}" | jq -cS "$others")" != "$(jq -cS "$others" "$MARKETPLACE_FILE")" ]; then
            git diff "$MARKETPLACE_FILE"
            echo "::error::Rewriting $MARKETPLACE_FILE changed content other than the '$PLUGIN_NAME' entry."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Open or update the marketplace PR
        if: steps.update.outputs.skip != 'true'
        working-directory: marketplace
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
          VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_SHA: ${{ steps.plugin.outputs.sha }}
          SHORT_SHA: ${{ steps.plugin.outputs.short_sha }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -euo pipefail

          if git diff --quiet "$MARKETPLACE_FILE"; then
            echo "factory-plugins already pins ${PLUGIN_NAME} to ${PLUGIN_SHA}; nothing to do."
            exit 0
          fi

          git config user.name "apify-bot"
          git config user.email "actions@apify.com"
          git checkout -B "$PR_BRANCH"
          git add "$MARKETPLACE_FILE"
          git commit -m "chore(${PLUGIN_NAME}): update plugin to v${VERSION} (${SHORT_SHA})"
          gh auth setup-git
          git push --force-with-lease origin "$PR_BRANCH"

          fork_owner="${FORK%%/*}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${PLUGIN_SHA}"
          title="chore(${PLUGIN_NAME}): update plugin to v${VERSION} (${SHORT_SHA})"
          body="Automated re-pin of the \`${PLUGIN_NAME}\` plugin (\`git-subdir\` source, path \`${PLUGIN_PATH}\`) to version \`${VERSION}\` at [\`${SHORT_SHA}\`](${commit_url}), opened by the \`sync-marketplace\` workflow in \`${GITHUB_REPOSITORY}\`. Only \`source.sha\` in \`${MARKETPLACE_FILE}\` changes."
          if [ -n "${RELEASE_URL:-}" ]; then
            body="${body}"$'\n\n'"Release notes: ${RELEASE_URL}"
          fi

          # `gh pr list --head` rejects "owner:branch", so filter the fork owner separately.
          existing="$(gh pr list --repo "$UPSTREAM" \
            --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open \
            --json number,headRepositoryOwner \
            --jq "map(select(.headRepositoryOwner.login == \"${fork_owner}\"))[0].number // empty")"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$UPSTREAM" --title "$title" --body "$body"
            echo "Updated existing PR #${existing}."
          else
            gh pr create --repo "$UPSTREAM" \
              --base "$BASE_BRANCH" \
              --head "${fork_owner}:${PR_BRANCH}" \
              --title "$title" \
              --body "$body"
          fi
